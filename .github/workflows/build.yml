name: Build and Push to Cachix

# 人工 push / PR / 手动触发的入口。真正的构建定义在 ./.github/workflows/accept.yml，
# update.yml 与 flake-update.yml 也调用同一个——三处共用一份「什么算绿」。
#
# 注意：自动化直推 main 用的是 GITHUB_TOKEN，其 push 事件不会再触发本 workflow（GitHub 的规定）。
# 那部分验收由调用方在自己的 workflow 内跑 accept.yml 完成，不依赖本文件的触发。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  accept:
    permissions:
      contents: read
    uses: ./.github/workflows/accept.yml
    with:
      # 留空 = 用调用方的 commit（push 是 main 的 tip，PR 是合并提交）
      ref: ''
      # PR 上不预取：那些 FOD 由非 PR 的运行送进 cachix 就够了
      prefetch: ${{ github.event_name != 'pull_request' }}
    secrets:
      cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
