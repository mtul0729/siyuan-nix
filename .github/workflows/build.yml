name: Build and Push to Cachix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v17
        with:
          name: mtul
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build siyuan-server
        run: nix build -L .#siyuan-server

      - name: Build prefetch derivations
        if: github.event_name != 'pull_request'
        run: |
          nix build -L .#siyuan-server.passthru.kernel.goModules
          nix build -L .#siyuan-server.passthru.ui.pnpmDeps
