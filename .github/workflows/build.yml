name: Build and Push to Cachix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
            server: true
          - os: ubuntu-24.04-arm
            system: aarch64-linux
            server: true
          # darwin 只能在这类 arm64 macOS runner 上构建/验证：github 的 Linux runner 编不出
          # aarch64-darwin，我们也没有远端 darwin builder。macOS runner 计费是 Linux 的 10 倍。
          - os: macos-14
            system: aarch64-darwin
            server: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v17
        with:
          name: mtul
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build siyuan-client
        run: nix build -L .#siyuan-client

      # 以下三项只有服务端所在的 Linux 平台才有（darwin 只提供 siyuan-client）
      - name: Build siyuan-server
        if: matrix.server
        run: nix build -L .#siyuan-server

      # 本推导在沙箱里必然失败（见 AGENTS.md：它专为“一次性暴露全部失败包”而存在），
      # 不能让它决定 run 的红绿，否则「CI 绿」这个信号等同于失效。失败结果仍留在该 step 的
      # 日志里供人翻阅（版本升级时就看它有没有出现新的失败包）。
      # 用 continue-on-error 而不是 if: false，是为了让后面的预取步骤仍能执行——之前这步一红
      # 就会连带跳过 Build prefetch derivations，那两个哈希预取推导在 CI 里等于形同虚设。
      - name: Run kernel tests
        if: matrix.server
        continue-on-error: true
        run: nix build -L .#checks.${{ matrix.system }}.siyuan-kernel-test

      - name: Build prefetch derivations
        if: github.event_name != 'pull_request' && matrix.server
        run: |
          nix build -L .#siyuan-server.passthru.kernel.goModules
          nix build -L .#siyuan-server.passthru.ui.pnpmDeps
