name: Update flake lock

# 与 update.yml（SiYuan 版本升级）正交：那条流水线只动 tag 和三个 FOD 哈希，
# 这里只跑 `nix flake update` 跟进 flake.lock 里的输入（目前仅 nixpkgs/nixos-unstable）。
#
# 不走 PR：构建通过就把 lock 直接推上 main，失败则开 issue 通知。验收分两层——
#   1) 推送前：本 workflow 在 x86_64-linux 上 nix build 两套包 + nix flake check 求值；
#   2) 推送后：App 令牌的 push 会触发 build.yml 全矩阵（aarch64-linux / aarch64-darwin
#      只能在这里验证），第二个 job 盯着那次运行，红了就开 issue。
# darwin 不在推送前那层是刻意的：本机（ubuntu runner）编不了 aarch64-darwin，
# 拦不住就只能靠推送后的全矩阵 + 通知兜底。
# 只涉及 main 一个分支：两套 pin（stable / alpha）都在同一个 flake.nix 里，
# 不存在「另一个分支的 lock 落后」这回事。
#
# 身份必须是 GitHub App 令牌：GitHub 规定 GITHUB_TOKEN 产生的事件不触发其它 workflow——
# 用它 push main，build.yml 根本不会跑。App 的一次性配置见 README「自动升级」一节，
# 两个 workflow 共用同一组 variable/secret。issue 通知反而用 GITHUB_TOKEN（需 issues:write）：
# 通知不需要触发任何 workflow。
#
# 注意：schedule 触发要求本文件已存在于默认分支（main）。
on:
  schedule:
    # 每周一次即可：nixpkgs 的更新值得追，但不值得像上游 tag 那样每天盯。
    # 每周北京时间 03:03（= 周日 19:03 UTC）；cron 只认 UTC，故此处写 19:03 周日
    - cron: '3 19 * * 0'
  workflow_dispatch:

# 同一时刻只跑一个，避免两次运行同时改 lock / 同时推 main
concurrency:
  group: flake-update
  cancel-in-progress: false

# GITHUB_TOKEN 只需 contents:read（读写都走 App 令牌）、issues:write（失败通知）
# 和 actions:read（watch 用 gh run list/watch 盯 build.yml）。
permissions:
  contents: read
  issues: write
  actions: read

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.lock.outputs.changed }}
      old_rev: ${{ steps.lock.outputs.old_rev }}
      new_rev: ${{ steps.lock.outputs.new_rev }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      # 先取 App 令牌，再让 checkout 用它，这样 git push 是 App 身份，能触发 build.yml
      - id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update flake.lock
        id: lock
        run: |
          set -euo pipefail
          old_rev="$(jq -r '.nodes.nixpkgs.locked.rev // empty' flake.lock)"
          nix flake update
          new_rev="$(jq -r '.nodes.nixpkgs.locked.rev // empty' flake.lock)"
          echo "old_rev=$old_rev" >> "$GITHUB_OUTPUT"
          echo "new_rev=$new_rev" >> "$GITHUB_OUTPUT"
          if git diff --quiet HEAD -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "flake.lock 已是最新（nixpkgs 仍为 \`$new_rev\`）。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # 求值层面的坏更新在这里就拦下；真正的构建在下一步
            nix flake check --no-build
          fi

      - name: Build server and client (x86_64-linux gate)
        if: steps.lock.outputs.changed == 'true'
        run: nix build -L .#siyuan-server .#siyuan-client

      # 直接推 main。若因 main 在本轮运行期间被人合入升级 PR 而拒绝（non-fast-forward），
      # 本 job 转红并走下面的通知——重跑一次即可，lock 会基于新 main 重算。
      - name: Push lock to main
        id: push
        if: steps.lock.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail

          # commit 作者归属到 bot：邮箱前缀必须是 bot 的**用户 ID**（不是 App ID），
          # 否则 GitHub 不会把 commit 归属到 <app-slug>[bot]（API 里表现为 login: none）。
          bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "flake: update nixpkgs lock (${{ steps.lock.outputs.old_rev }} → ${{ steps.lock.outputs.new_rev }})"
          git push origin HEAD:main
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            printf 'nixpkgs \`%s\` → \`%s\`，x86_64-linux 构建通过，已直接推上 [main](https://github.com/${{ github.repository }}/commit/%s)。\n\n' \
              "${{ steps.lock.outputs.old_rev }}" "${{ steps.lock.outputs.new_rev }}" "$sha"
            printf '全矩阵复核（含 aarch64-linux / aarch64-darwin）由 push 触发的 `build.yml` 进行，红了会自动开 issue。\n'
          } >> "$GITHUB_STEP_SUMMARY"

      # 通知用 GITHUB_TOKEN 就够：issue 不需要触发其它 workflow
      - name: Notify on failure (pre-push gate)
        if: failure() && steps.lock.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="flake.lock 自动更新构建失败（合入前）"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="$(printf '%s\n\nnixpkgs `%s` → `%s` 在 x86_64-linux 上构建/求值未通过，lock 未合入。\n\n[查看运行日志](%s)' \
            "$(date -u '+%Y-%m-%d %H:%M UTC')" \
            "${{ steps.lock.outputs.old_rev }}" "${{ steps.lock.outputs.new_rev }}" "$run_url")"
          num="$(gh issue list --state open --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)"
          if [[ -n "$num" ]]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  # 推上去之后盯 build.yml 的全矩阵运行（aarch64-linux / darwin 只在这里能验证），
  # 红了开 issue。schedule 失败本身也会有邮件，但 issue 是可跟踪、可关的提醒。
  watch:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Watch post-push build.yml run
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha='${{ needs.update.outputs.sha }}'

          # push 事件注册成 run 有延迟，轮询等它出现
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --workflow=build.yml --commit "$sha" --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty' || true)"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 10
          done
          if [[ -z "$run_id" ]]; then
            echo "::warning::没找到 build.yml 的运行（commit $sha），跳过监视。"
            exit 0
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --exit-status --interval 60

      - name: Notify on failure (post-push)
        if: failure() && steps.watch.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="flake.lock 自动更新后全矩阵构建失败"
          sha='${{ needs.update.outputs.sha }}'
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.watch.outputs.run_id }}"
          body="$(printf '%s\n\nnixpkgs `%s` → `%s` 推上 main 后，`build.yml` 全矩阵未通过。\n\ncommit: %s\n[查看运行日志](%s)' \
            "$(date -u '+%Y-%m-%d %H:%M UTC')" \
            "${{ needs.update.outputs.old_rev }}" "${{ needs.update.outputs.new_rev }}" \
            "https://github.com/${{ github.repository }}/commit/$sha" \
            "$run_url")"
          num="$(gh issue list --state open --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)"
          if [[ -n "$num" ]]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
