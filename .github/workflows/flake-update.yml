name: Update flake lock

# 与 update.yml（SiYuan 版本升级）正交：那条流水线只动 tag 和 FOD 哈希，
# 这里只跑 `nix flake update` 跟进 flake.lock 里的输入（目前仅 nixpkgs/nixos-unstable）。
#
# 结构与 update.yml 一致：prepare（更新 lock + 求值闸门 + 推候选分支）→ accept（复用
# ./.github/workflows/accept.yml 三平台验收）→ publish（快进 main）。
# 验收放在本 workflow 内，所以同样不需要 GitHub App：GITHUB_TOKEN 推送就够
# （App 令牌的唯一用途是让 push 触发别的 workflow，而我们不再依赖那个触发）。
# 只涉及 main 一个分支：两套 pin（stable / alpha）都在同一个 flake.nix 里，
# 不存在「另一个分支的 lock 落后」这回事。
on:
  schedule:
    # 每周一次即可：nixpkgs 的更新值得追，但不值得像上游 tag 那样每天盯。
    # 每周北京时间 03:03（= 周日 19:03 UTC）；cron 只认 UTC，故此处写 19:03 周日
    - cron: '3 19 * * 0'
  workflow_dispatch:

# 与 update.yml 共用一个并发组：两个 workflow 都只往 main 推，绝不能在同一时刻各推各的
# （否则后推的那个会因非快进而被服务端拒，但共用组可以从源头避免这种竞态）。
concurrency:
  group: siyuan-main-bot
  cancel-in-progress: false

# contents: write（推分支与 main）、issues: write（失败时开/更新 issue）
permissions:
  contents: write
  issues: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.lock.outputs.changed }}
      old_rev: ${{ steps.lock.outputs.old_rev }}
      new_rev: ${{ steps.lock.outputs.new_rev }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update flake.lock
        id: lock
        run: |
          set -euo pipefail
          old_rev="$(jq -r '.nodes.nixpkgs.locked.rev // empty' flake.lock)"
          nix flake update
          new_rev="$(jq -r '.nodes.nixpkgs.locked.rev // empty' flake.lock)"
          echo "old_rev=$old_rev" >> "$GITHUB_OUTPUT"
          echo "new_rev=$new_rev" >> "$GITHUB_OUTPUT"
          if git diff --quiet HEAD -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "flake.lock 已是最新（nixpkgs 仍为 \`$new_rev\`）。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # 求值层面的坏更新在这里就拦下；真正的构建在 accept
            nix flake check --no-build
          fi

      - name: Push candidate branch
        if: steps.lock.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c auto-update/flake-lock
          git add flake.lock
          git commit -m "flake: update nixpkgs lock (${{ steps.lock.outputs.old_rev }} → ${{ steps.lock.outputs.new_rev }})"
          git push --force origin HEAD:refs/heads/auto-update/flake-lock

  accept:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/accept.yml
    with:
      ref: auto-update/flake-lock
    secrets:
      cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  publish:
    needs: [prepare, accept]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Fast-forward main to the verified candidate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin \
            "+refs/heads/auto-update/flake-lock:refs/remotes/origin/auto-update/flake-lock" \
            "+refs/heads/main:refs/remotes/origin/main"
          # 服务端快进：candidate 必须是当前 main 的后代，否则拒绝（安全失败、绝不覆盖）。
          # 不在本地 rebase —— 候选分支是 --depth=1 浅取的，父提交不在本地，
          # 本地 rebase 会把候选当根提交，与 main 的 flake.nix 撞成 add/add 冲突。
          candidate="$(git rev-parse "refs/remotes/origin/auto-update/flake-lock")"
          git push origin "${candidate}:refs/heads/main"
          {
            printf 'nixpkgs \`%s\` → \`%s\`，三平台验收通过，已快进 `main`。\n' \
              "${{ needs.prepare.outputs.old_rev }}" "${{ needs.prepare.outputs.new_rev }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # 任何一步失败且 lock 确有变化时开/更新 issue：这是可跟踪、可关的提醒
  # （GITHUB_TOKEN 就够，issue 不需要触发任何 workflow）。
  notify:
    needs: [prepare, accept, publish]
    if: failure() && needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="flake.lock 自动更新失败"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="$(printf '%s\n\nnixpkgs `%s` → `%s` 在自动更新流程中未通过（求值、三平台构建或推送），lock 未合入。\n\n[查看运行日志](%s)' \
            "$(date -u '+%Y-%m-%d %H:%M UTC')" \
            "${{ needs.prepare.outputs.old_rev }}" "${{ needs.prepare.outputs.new_rev }}" \
            "$run_url")"
          num="$(gh issue list --state open --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)"
          if [[ -n "$num" ]]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
