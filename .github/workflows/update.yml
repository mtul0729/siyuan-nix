name: Auto update SiYuan

# 一次运行只解析一个目标：「正式 / beta / alpha 中版本最高的那个 release」。
#   alpha-release 总是滚到它（force-push，滚动分支，供提前试用）
#   该 release 是稳定版（vX.Y.Z，无预发布后缀）时，同时给 main 开 PR（人工合并）
#
# 两个分支共用这一轮算出的 pin：稳定版时先在 main 的 checkout 上轮换一次哈希，
# alpha-release 再把这三个文件取过去——一次 go modules / pnpm FOD 真构建，不是两次。
# （方向必须是 main → alpha：main 是 flake.nix 里内核/NixOS 模块等内容的权威来源，
#  alpha 只是上面叠了 pin 的滚动分支；反过来会把 main 的改动悄悄回退掉。）
#
# 身份必须是 GitHub App 令牌：GitHub 规定 GITHUB_TOKEN 产生的事件不触发其它 workflow——
# 用它开的 PR 会停在 action_required 等人工批准，用它 push 到 alpha-release 则 build.yml 根本不跑。
#
# 注意：schedule 触发要求本文件已存在于默认分支（main）。
on:
  schedule:
    # 每天北京时间 03:17（= 前一天 19:17 UTC）检查一次；cron 只认 UTC，故此处写 19:17
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: '目标 release tag（如 v3.9.0 / v3.8.7-alpha.1）；留空则自动取正式/beta/alpha 中版本最高者'
        required: false
        default: ''
      force:
        description: 'tag 未变也重算哈希（--force）'
        required: false
        default: false
        type: boolean

# 同一时刻只跑一个，避免两次运行同时改 tag/开 PR；不取消进行中的运行（构建很贵）
concurrency:
  group: auto-update-siyuan
  cancel-in-progress: false

# GITHUB_TOKEN 只需只读：所有写操作（推分支、开 PR）都走下面的 GitHub App 令牌。
permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # 先取 App 令牌，再让 checkout 用它，这样 git push 与 gh 都是 App 身份。
      - id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v17
        with:
          name: mtul
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Resolve the newest release
        id: target
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [[ -z "$tag" ]]; then
            tag="$(python3 scripts/update.py --channel=any --print-latest)"
          fi
          stable=false
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            stable=true
          fi
          {
            echo "tag=$tag"
            echo "stable=$stable"
          } >> "$GITHUB_OUTPUT"
          echo "目标 release：\`$tag\`$(
            [[ "$stable" == true ]] && printf '（稳定版，同时给 main 开 PR）' || printf '（预发布，只滚 alpha-release）'
          )" >> "$GITHUB_STEP_SUMMARY"

      # 稳定版才动 main：在这一步完成唯一的哈希轮换，产出的 pin 同时供 alpha-release 取用。
      # 预发布时 main 不动，轮换留到 alpha 那一步去做。
      - name: Bump main tag and rotate FOD hashes
        id: main-bump
        if: steps.target.outputs.stable == 'true'
        env:
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$INPUT_FORCE" == "true" ]]; then
            args+=(--force)
          fi
          python3 scripts/update.py "${args[@]}" '${{ steps.target.outputs.tag }}'
          # 用 HEAD 而非 index：alpha 那一步会用 git checkout <branch> -- 落 pin，那样改动是已暂存的，
          # 单纯 git diff（工作区 vs index）会看不见。
          if git diff --quiet HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "main 已指向 ${{ steps.target.outputs.tag }}，无需升级。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            python3 scripts/update.py --print-pins > pins.json
          fi

      - name: Resolve branch and existing PR
        id: pr
        if: steps.main-bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          branch="auto-update/siyuan-$(jq -r .tag pins.json)"
          {
            echo "tag=$(jq -r .tag pins.json)"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"
          exists=false
          if [[ -n "$(gh pr list --state open --head "$branch" --json number --jq '.[].number')" ]]; then
            exists=true
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      # 提交与开 PR 分成两步：PR 已存在时只跳过开单，分支仍要建出来——alpha 那一步要从它取 pin。
      - name: Commit and push bump branch
        if: steps.main-bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          branch='${{ steps.pr.outputs.branch }}'

          # commit 作者与 PR 作者一致。邮箱前缀必须是 bot 的**用户 ID**（不是 App ID），
          # 否则 GitHub 不会把 commit 归属到 <app-slug>[bot]（API 里表现为 login: none）。
          bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add flake.nix pkgs/siyuan-kernel.nix pkgs/siyuan-ui.nix
          git commit -m "siyuan: bump to ${{ steps.pr.outputs.tag }}"
          # 这些分支归自动化所有，force 覆盖以保持幂等（不会覆盖人工改动：它们只由本 workflow 写）
          git push --force origin "$branch"

      - name: Open PR against main
        if: steps.main-bump.outputs.changed == 'true' && steps.pr.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          tag='${{ steps.pr.outputs.tag }}'
          branch='${{ steps.pr.outputs.branch }}'

          {
            printf '自动升级到上游稳定版 `%s`。\n\n' "$tag"
            printf '由 `.github/workflows/update.yml` 调用 `scripts/update.py` 生成（升 tag + 占位 → 真实哈希轮换）。\n\n'
            printf '| FOD | 位置 | 值 |\n'
            printf '| --- | --- | --- |\n'
            printf '| `src` | `flake.nix` | `%s` |\n' "$(jq -r .src pins.json)"
            printf '| `vendorHash` | `pkgs/siyuan-kernel.nix` | `%s` |\n' "$(jq -r .vendorHash pins.json)"
            printf '| `pnpmDeps` | `pkgs/siyuan-ui.nix` | `%s` |\n\n' "$(jq -r .pnpmDeps pins.json)"
            printf '验收以本 PR 上的 `build.yml` 为准：`siyuan-server` 与 `siyuan-client` 构建成功即视为绿。\n'
            printf '`siyuan-kernel-test` 跑红是设计内常态（沙箱缺少 `../../app/*` 资源），不是本次升级的回归。\n'
          } > pr-body.md

          gh pr create --base main --head "$branch" \
            --title "siyuan: bump to $tag" \
            --body-file pr-body.md

      # alpha-release 总是滚到本次解析出的 release。三种来源：
      #   a) 稳定版且 main 本轮升到了它 → 直接取走 bump 分支那三个文件（不重跑 FOD 构建）
      #   b) 稳定版但 main 已经在它上面 → 直接置为 main 的 commit（同 SHA，零哈希轮换）
      #   c) 预发布 → 在 alpha-release 自己的 checkout 上做唯一那次轮换
      - name: Roll alpha-release
        id: alpha
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          tag='${{ steps.target.outputs.tag }}'
          stable='${{ steps.target.outputs.stable }}'
          bump_branch='${{ steps.pr.outputs.branch }}'

          # 必须 checkout alpha-release 本身：该分支的 tag/哈希与 main 不同，
          # 从 main 起算会把 main 的 pin 当成基准（可能把分支回退到旧正式版）。
          git fetch --depth=1 origin "+refs/heads/alpha-release:refs/remotes/origin/alpha-release"
          git checkout -B alpha-release origin/alpha-release

          mode=commit
          if [[ "$stable" == "true" ]]; then
            if [[ '${{ steps.main-bump.outputs.changed }}' == "true" ]]; then
              git checkout "$bump_branch" -- flake.nix pkgs/siyuan-kernel.nix pkgs/siyuan-ui.nix
            elif [[ "$(git rev-parse HEAD)" == "$(git rev-parse "origin/main")" ]]; then
              mode=skip
            else
              # 已经在 main 那个 commit 上才跳过，否则置为它——比 commit 而非 tree：
              # 「内容相同但 SHA 不同」正是要消掉的重复，比 tree 会让它永远对齐不过来
              git reset --hard origin/main
              mode=push
            fi
          else
            args=()
            if [[ "$INPUT_FORCE" == "true" ]]; then
              args+=(--force)
            fi
            python3 scripts/update.py "${args[@]}" "$tag"
          fi

          if [[ "$mode" == "commit" ]] && git diff --quiet HEAD; then
            mode=skip
          fi

          if [[ "$mode" == "skip" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "alpha-release 已指向 \`$tag\`。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$mode" == "commit" ]]; then
            # commit 作者归属到 bot：邮箱前缀必须是 bot 的**用户 ID**（不是 App ID）
            bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
            git add flake.nix pkgs/siyuan-kernel.nix pkgs/siyuan-ui.nix
            git commit -m "siyuan: bump to $(python3 scripts/update.py --print-pins | jq -r .tag)"
          fi

          # 该分支归自动化所有，force 覆盖以保持幂等
          git push --force origin "HEAD:refs/heads/alpha-release"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            printf '滚动更新 `alpha-release` 到 \`%s\`。\n\n' "$tag"
            case "$mode" in
              push) printf '该 release 是稳定版且 `main` 已在它上面，已直接把该分支置为 `main` 的 commit（未重算哈希）。\n' ;;
              commit) printf '稳定版取用 `main` 本轮算出的 pin / 预发布由 `scripts/update.py` 完成轮换。\n' ;;
            esac
            printf '本分支不会自动合并到 `main`——`main` 只追稳定版。\n'
            printf '验收以本分支上的 `build.yml` 为准：`siyuan-server` 与 `siyuan-client` 构建成功即视为绿。\n'
          } >> "$GITHUB_STEP_SUMMARY"
