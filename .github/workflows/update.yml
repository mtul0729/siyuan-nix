name: Auto update SiYuan

# 一个分支（main）上维护两套 pin，两个**互相独立**的目标：
#   stable → 最新稳定版（vX.Y.Z）              ：siyuan-server / siyuan-client
#   alpha  → 正式/beta/alpha 中版本最高者      ：siyuan-server-alpha / siyuan-client-alpha
#
# 流程拆成三个 job：prepare（解析 + 轮换 pin，推候选分支）→ accept（复用
# ./.github/workflows/accept.yml 在三个平台上验收）→ publish（快进 main）。
# 验收放在本 workflow 内，因此不再需要 GitHub App：用 GITHUB_TOKEN 推送即可
# （App 令牌的唯一用途是「让 push 触发别的 workflow」，而现在我们不依赖那个触发）。
#
# 为什么必须是两个目标而不是「解析一个最高版本」：上游习惯正式版一发就紧接着开下一个版本的
# alpha（v3.8.6 之后立刻有 v3.8.7-alpha.1），于是 v3.8.7 发布时窗口里很可能已有 v3.8.8-alpha.1，
# 单一目标是那个 alpha，stable 那套 pin 就永远拿不到 v3.8.7。stable 的解析必须独立。
#
# 两个目标 tag 相同时（最新 release 恰好是正式版）只做一次哈希轮换，两套 pin 一起写——
# 这就是过去「两个分支在稳定版重合」要去重的那部分，现在结构性消失了。
on:
  schedule:
    # 每天北京时间 03:17（= 前一天 19:17 UTC）检查一次；cron 只认 UTC，故此处写 19:17
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      stable_tag:
        description: 'stable 的目标 tag（如 v3.9.0）；留空则自动取上游最新稳定版'
        required: false
        default: ''
      alpha_tag:
        description: 'alpha 的目标 tag（如 v3.8.8-alpha.1）；留空则自动取正式/beta/alpha 中最高者'
        required: false
        default: ''
      force:
        description: 'tag 未变也重算哈希（--force）'
        required: false
        default: false
        type: boolean

# 同一时刻只跑一个，避免两次运行同时改 pin / 同时推 main
concurrency:
  group: auto-update-siyuan
  cancel-in-progress: false

# 直推 main 需要 contents: write；accept 那个 job 单独降回只读。
permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.rotate.outputs.changed }}
      branch: ${{ steps.target.outputs.branch }}
      stable: ${{ steps.target.outputs.stable }}
      alpha: ${{ steps.target.outputs.alpha }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Resolve both targets
        id: target
        env:
          INPUT_STABLE: ${{ github.event.inputs.stable_tag }}
          INPUT_ALPHA: ${{ github.event.inputs.alpha_tag }}
        run: |
          set -euo pipefail
          targets="$(python3 scripts/update.py --print-targets)"
          stable="$(printf '%s' "$targets" | jq -r .stable)"
          alpha="$(printf '%s' "$targets" | jq -r .alpha)"
          if [[ -n "$INPUT_STABLE" ]]; then
            stable="$INPUT_STABLE"
          fi
          if [[ -n "$INPUT_ALPHA" ]]; then
            alpha="$INPUT_ALPHA"
          fi
          {
            echo "stable=$stable"
            echo "alpha=$alpha"
            echo "branch=auto-update/siyuan-$stable-$alpha"
          } >> "$GITHUB_OUTPUT"
          {
            printf 'stable → \`%s\`（最新稳定版）\n\n' "$stable"
            printf 'alpha → \`%s\`（正式/beta/alpha 中最高者）\n\n' "$alpha"
            if [[ "$stable" == "$alpha" ]]; then
              printf '两者相同：只轮换一次哈希，两套 pin 一起写。\n'
            else
              printf '两者不同：latest 是预发布，两套 pin 各轮换一次。\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rotate pins and hashes
        id: rotate
        env:
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          args=(--stable '${{ steps.target.outputs.stable }}' --alpha '${{ steps.target.outputs.alpha }}')
          if [[ "$INPUT_FORCE" == "true" ]]; then
            args+=(--force)
          fi
          python3 scripts/update.py "${args[@]}"
          if git diff --quiet HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "两套 pin 都已是各自目标的最新版本。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 候选分支：accept 在它上面验收、publish 再把它快进到 main。
      # 用 GITHUB_TOKEN 推分支完全够用（我们不需要它触发别的 workflow）。
      - name: Push candidate branch
        if: steps.rotate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c '${{ steps.target.outputs.branch }}'
          git add flake.nix
          git commit -m "siyuan: stable ${{ steps.target.outputs.stable }} / alpha ${{ steps.target.outputs.alpha }}"
          git push --force origin 'HEAD:refs/heads/${{ steps.target.outputs.branch }}'

  # 验收：三个平台，稳定版把关、抢先版只记录。红了就不进 publish。
  accept:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/accept.yml
    with:
      ref: ${{ needs.prepare.outputs.branch }}
      prefetch: true
    secrets:
      cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  publish:
    needs: [prepare, accept]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Fast-forward main to the verified commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin \
            "+refs/heads/${{ needs.prepare.outputs.branch }}:refs/remotes/origin/${{ needs.prepare.outputs.branch }}" \
            "+refs/heads/main:refs/remotes/origin/main"
          git checkout -B publish "origin/${{ needs.prepare.outputs.branch }}"
          # main 可能在本轮运行期间被人工推进：先 rebase，再快进推送
          git rebase origin/main
          git push origin "HEAD:refs/heads/main"
          {
            printf '`main` 已快进到验收通过的 commit：stable \`%s\`、alpha \`%s\`\n\n' \
              "${{ needs.prepare.outputs.stable }}" "${{ needs.prepare.outputs.alpha }}"
            printf '注意：GITHUB_TOKEN 的 push 不会触发 `build.yml`，本次验收已在 accept job 内完成。\n'
          } >> "$GITHUB_STEP_SUMMARY"
