name: Auto update SiYuan

# 一条流水线、两个**独立**的目标，都由 bot 直推到对应分支（不开 PR）：
#   main          → 最新稳定版（vX.Y.Z）
#   alpha-release → 正式/beta/alpha 中版本最高者（滚动分支，force-push）
#
# 为什么必须是两个目标而不是「解析一个最高版本、stable 时顺带推 main」：
# 上游习惯是正式版一发就紧接着开下一个版本的 alpha（v3.8.6 之后立刻有 v3.8.7-alpha.1）。
# 于是 v3.8.7 正式发布时，窗口里很可能已经有 v3.8.8-alpha.1，单次运行解析出的「最高版本」
# 是那个 alpha，main 就永远拿不到 v3.8.7——停在旧稳定版上。stable 的解析必须独立。
#
# 去重只发生在两者重合时（最新 release 恰好是稳定版）：那一轮哈希轮换只做一次，
# alpha-release 直接取 main 算出的 pin（main 已在该 tag 时干脆 reset 成 main 的 commit）。
# 方向固定 main → alpha：main 是 flake.nix 内容（内核接线、NixOS 模块）的权威来源，
# alpha 只是叠了 pin 的滚动分支，反向复制会把 main 的改动悄悄回退掉。
#
# 身份必须是 GitHub App 令牌：GitHub 规定 GITHUB_TOKEN 产生的事件不触发其它 workflow——
# 用它 push 的话，main / alpha-release 上的 build.yml 根本不会跑，直推就失去了验收。
# 验收信号就是两个分支各自的 push 触发的 build.yml。
#
# 注意：schedule 触发要求本文件已存在于默认分支（main）。
on:
  schedule:
    # 每天北京时间 03:17（= 前一天 19:17 UTC）检查一次；cron 只认 UTC，故此处写 19:17
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'main 的目标 tag（如 v3.9.0）；留空则自动取上游最新稳定版'
        required: false
        default: ''
      alpha_tag:
        description: 'alpha-release 的目标 tag（如 v3.8.7-alpha.1）；留空则自动取正式/beta/alpha 中最高者'
        required: false
        default: ''
      force:
        description: 'tag 未变也重算哈希（--force）'
        required: false
        default: false
        type: boolean

# 同一时刻只跑一个，避免两次运行同时改 tag/开 PR；不取消进行中的运行（构建很贵）
concurrency:
  group: auto-update-siyuan
  cancel-in-progress: false

# GITHUB_TOKEN 只需只读：所有写操作（推分支、开 PR）都走下面的 GitHub App 令牌。
permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # 先取 App 令牌，再让 checkout 用它，这样 git push 与 gh 都是 App 身份。
      - id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # 两个目标互不相干：stable 只认 vX.Y.Z，newest 是全部 tag 里的最高者。
      # newest == stable 表示「最新 release 恰好是稳定版」，也就是两者本轮要做同一件事。
      - name: Resolve both targets
        id: target
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_ALPHA_TAG: ${{ github.event.inputs.alpha_tag }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [[ -z "$tag" ]]; then
            tag="$(python3 scripts/update.py --print-latest)"
          fi
          alpha_tag="$INPUT_ALPHA_TAG"
          if [[ -z "$alpha_tag" ]]; then
            alpha_tag="$(python3 scripts/update.py --channel=any --print-latest)"
          fi
          same=false
          if [[ "$tag" == "$alpha_tag" ]]; then
            same=true
          fi
          {
            echo "tag=$tag"
            echo "alpha_tag=$alpha_tag"
            echo "same=$same"
          } >> "$GITHUB_OUTPUT"
          {
            printf 'main → \`%s\`（最新稳定版）\n\n' "$tag"
            printf 'alpha-release → \`%s\`（正式/beta/alpha 中最高者）\n\n' "$alpha_tag"
            if [[ "$same" == true ]]; then
              printf '两者相同：alpha-release 复用本轮算出的 pin，不再单独轮换哈希。\n'
            else
              printf '两者不同：latest 是预发布，main 的升级照走，alpha-release 单独轮换一次。\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # 阶段一：main。永远按 stable 自己的解析走，不受预发布影响
      # （否则一个更新的 alpha 会把 stable 的升级整个遮蔽掉，main 停在旧版本上）。
      # 机器人直接推到 main，不开 PR：验收交给 main 上那次 push 触发的 build.yml。
      - name: Bump main tag and rotate FOD hashes
        id: main-bump
        env:
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$INPUT_FORCE" == "true" ]]; then
            args+=(--force)
          fi
          python3 scripts/update.py "${args[@]}" '${{ steps.target.outputs.tag }}'
          # 用 HEAD 而非 index：alpha 那一步会用 git checkout <commit> -- 落 pin，那样改动是已暂存的，
          # 单纯 git diff（工作区 vs index）会看不见。
          if git diff --quiet HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "main 已指向 ${{ steps.target.outputs.tag }}，无需升级。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            python3 scripts/update.py --print-pins > pins.json
          fi

      - name: Commit and push to main
        id: main-push
        if: steps.main-bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          tag="$(jq -r .tag pins.json)"

          # commit 归属到 bot：邮箱前缀必须是 bot 的**用户 ID**（不是 App ID），
          # 否则 GitHub 不会把 commit 归属到 <app-slug>[bot]（API 里表现为 login: none）。
          bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add flake.nix pkgs/siyuan-kernel.nix pkgs/siyuan-ui.nix
          git commit -m "siyuan: bump to $tag"
          # 直推 main（不开 PR）：必须是 App 令牌，GITHUB_TOKEN 的 push 不会触发 build.yml
          git push origin "HEAD:refs/heads/main"
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          {
            printf '`main` 直推到 \`%s\`（最新稳定版），验收看本次 push 触发的 `build.yml`。\n\n' "$tag"
            printf '| FOD | 位置 | 值 |\n'
            printf '| --- | --- | --- |\n'
            printf '| `src` | `flake.nix` | `%s` |\n' "$(jq -r .src pins.json)"
            printf '| `vendorHash` | `pkgs/siyuan-kernel.nix` | `%s` |\n' "$(jq -r .vendorHash pins.json)"
            printf '| `pnpmDeps` | `pkgs/siyuan-ui.nix` | `%s` |\n\n' "$(jq -r .pnpmDeps pins.json)"
            printf '`siyuan-kernel-test` 跑红是设计内常态（沙箱缺少 `../../app/*` 资源），不是本次升级的回归。\n'
          } >> "$GITHUB_STEP_SUMMARY"

      # 阶段二：alpha-release 滚到 newest。三种来源：
      #   a) newest == stable 且 main 本轮升到了它 → 取走 bump 分支那三个文件（不重跑 FOD 构建）
      #   b) newest == stable 但 main 已经在它上面 → 直接置为 main 的 commit（同 SHA，零哈希轮换）
      #   c) newest 是预发布 → 在 alpha-release 自己的 checkout 上单独轮换一次
      # 无论哪种来源，flake.lock 都同步 main 的（alpha 上不做 nixpkgs 升级的决策）。
      - name: Roll alpha-release
        id: alpha
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          alpha_tag='${{ steps.target.outputs.alpha_tag }}'
          # 两者相同时取用 main 这一轮刚推上去的 commit（其 pin 就是本轮换出来的）
          main_commit='${{ steps.main-push.outputs.commit }}'

          # 必须 checkout alpha-release 本身：该分支的 tag/哈希与 main 不同，
          # 从 main 起算会把 main 的 pin 当成基准（可能把分支回退到旧正式版）。
          # main 一并 fetch：flake.lock 要从这里同步（见下）。
          git fetch --depth=1 origin "+refs/heads/alpha-release:refs/remotes/origin/alpha-release" "+refs/heads/main:refs/remotes/origin/main"
          git checkout -B alpha-release origin/alpha-release

          mode=commit
          if [[ '${{ steps.target.outputs.same }}' == "true" ]]; then
            if [[ '${{ steps.main-bump.outputs.changed }}' == "true" ]]; then
              git checkout "$main_commit" -- flake.nix pkgs/siyuan-kernel.nix pkgs/siyuan-ui.nix
            elif [[ "$(git rev-parse HEAD)" == "$(git rev-parse "origin/main")" ]]; then
              mode=skip
            else
              # 已经在 main 那个 commit 上才跳过，否则置为它——比 commit 而非 tree：
              # 「内容相同但 SHA 不同」正是要消掉的重复，比 tree 会让它永远对齐不过来
              git reset --hard origin/main
              mode=push
            fi
          else
            args=()
            if [[ "$INPUT_FORCE" == "true" ]]; then
              args+=(--force)
            fi
            python3 scripts/update.py "${args[@]}" "$alpha_tag"
          fi

          # flake.lock 不在 alpha 上自行更新，始终同步 main 的（方向 main → alpha，
          # 与 pin 同一原则：main 是内容权威）。放在 skip 判定之前——pins 未变但
          # main 的 lock 更新了（flake-update.yml 推的）也要落一次 commit 推下去，
          # 否则 alpha 的 nixpkgs 会静默落后。
          if [[ "$mode" != "push" ]]; then
            git checkout origin/main -- flake.lock
          fi

          if [[ "$mode" == "commit" ]] && git diff --quiet HEAD; then
            mode=skip
          fi

          if [[ "$mode" == "skip" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "alpha-release 已指向 \`$alpha_tag\`。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$mode" == "commit" ]]; then
            # commit 作者归属到 bot：邮箱前缀必须是 bot 的**用户 ID**（不是 App ID）
            bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
            git add flake.nix pkgs/siyuan-kernel.nix pkgs/siyuan-ui.nix flake.lock
            # pins 没动、只同步了 lock 时，别写成误导性的 "bump to ..."
            if git diff --quiet HEAD -- flake.nix pkgs/siyuan-kernel.nix pkgs/siyuan-ui.nix; then
              git commit -m "flake: sync nixpkgs lock from main"
            else
              git commit -m "siyuan: bump to $(python3 scripts/update.py --print-pins | jq -r .tag)"
            fi
          fi

          # 该分支归自动化所有，force 覆盖以保持幂等
          git push --force origin "HEAD:refs/heads/alpha-release"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            printf '滚动更新 `alpha-release` 到 \`%s\`。\n\n' "$alpha_tag"
            case "$mode" in
              push) printf '与 main 当前目标相同且 main 已在它上面，已直接把该分支置为 `main` 的 commit（未重算哈希）。\n' ;;
              commit) printf '取用 main 本轮算出的 pin / 由 `scripts/update.py` 单独轮换。\n' ;;
            esac
            printf '`flake.lock`（nixpkgs 输入）已同步 `main` 的版本，不在 alpha 上单独升级。\n'
            printf '本分支不会自动合并到 `main`——`main` 只追稳定版。\n'
            printf '验收以本分支上的 `build.yml` 为准：`siyuan-server` 与 `siyuan-client` 构建成功即视为绿。\n'
          } >> "$GITHUB_STEP_SUMMARY"
