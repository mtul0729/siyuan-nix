name: Auto update SiYuan

# 一个分支（main）上维护两套 pin，两个**互相独立**的目标，都由 bot 直推：
#   stable → 最新稳定版（vX.Y.Z）              ：siyuan-server / siyuan-client
#   alpha  → 正式/beta/alpha 中版本最高者      ：siyuan-server-alpha / siyuan-client-alpha
#
# 为什么必须是两个目标而不是「解析一个最高版本」：上游习惯正式版一发就紧接着开下一个版本的
# alpha（v3.8.6 之后立刻有 v3.8.7-alpha.1），于是 v3.8.7 发布时窗口里很可能已有 v3.8.8-alpha.1，
# 单一目标是那个 alpha，stable 那套 pin 就永远拿不到 v3.8.7。stable 的解析必须独立。
#
# 两个目标 tag 相同时（最新 release 恰好是正式版）只做一次哈希轮换，两套 pin 一起写——
# 这就是过去「两个分支在稳定版重合」要去重的那部分，现在结构性消失了。
#
# 身份必须是 GitHub App 令牌：GitHub 规定 GITHUB_TOKEN 产生的事件不触发其它 workflow——
# 用它 push 的话 main 上的 build.yml 根本不会跑，直推就失去了验收。
# 验收信号就是这次 push 触发的 build.yml：稳定版两套包把关，抢先版只记录不把关。
#
# 注意：schedule 触发要求本文件已存在于默认分支（main）。
on:
  schedule:
    # 每天北京时间 03:17（= 前一天 19:17 UTC）检查一次；cron 只认 UTC，故此处写 19:17
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      stable_tag:
        description: 'stable 的目标 tag（如 v3.9.0）；留空则自动取上游最新稳定版'
        required: false
        default: ''
      alpha_tag:
        description: 'alpha 的目标 tag（如 v3.8.8-alpha.1）；留空则自动取正式/beta/alpha 中最高者'
        required: false
        default: ''
      force:
        description: 'tag 未变也重算哈希（--force）'
        required: false
        default: false
        type: boolean

# 同一时刻只跑一个，避免两次运行同时改 pin / 同时推 main
concurrency:
  group: auto-update-siyuan
  cancel-in-progress: false

# GITHUB_TOKEN 只需只读：写操作（git push）都走下面的 GitHub App 令牌。
permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # 先取 App 令牌，再让 checkout 用它，这样 git push 是 App 身份，能触发 build.yml
      - id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Resolve both targets
        id: target
        env:
          INPUT_STABLE: ${{ github.event.inputs.stable_tag }}
          INPUT_ALPHA: ${{ github.event.inputs.alpha_tag }}
        run: |
          set -euo pipefail
          targets="$(python3 scripts/update.py --print-targets)"
          stable="$(printf '%s' "$targets" | jq -r .stable)"
          alpha="$(printf '%s' "$targets" | jq -r .alpha)"
          if [[ -n "$INPUT_STABLE" ]]; then
            stable="$INPUT_STABLE"
          fi
          if [[ -n "$INPUT_ALPHA" ]]; then
            alpha="$INPUT_ALPHA"
          fi
          {
            echo "stable=$stable"
            echo "alpha=$alpha"
          } >> "$GITHUB_OUTPUT"
          {
            printf 'stable → \`%s\`（最新稳定版）\n\n' "$stable"
            printf 'alpha → \`%s\`（正式/beta/alpha 中最高者）\n\n' "$alpha"
            if [[ "$stable" == "$alpha" ]]; then
              printf '两者相同：只轮换一次哈希，两套 pin 一起写。\n'
            else
              printf '两者不同：latest 是预发布，两套 pin 各轮换一次。\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rotate pins and hashes
        id: rotate
        env:
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          args=(--stable '${{ steps.target.outputs.stable }}' --alpha '${{ steps.target.outputs.alpha }}')
          if [[ "$INPUT_FORCE" == "true" ]]; then
            args+=(--force)
          fi
          python3 scripts/update.py "${args[@]}"
          if git diff --quiet HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "两套 pin 都已是各自目标的最新版本。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push to main
        if: steps.rotate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          stable='${{ steps.target.outputs.stable }}'
          alpha='${{ steps.target.outputs.alpha }}'

          # commit 归属到 bot：邮箱前缀必须是 bot 的**用户 ID**（不是 App ID），
          # 否则 GitHub 不会把 commit 归属到 <app-slug>[bot]（API 里表现为 login: none）。
          bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add flake.nix
          git commit -m "siyuan: stable $stable / alpha $alpha"
          # 直推 main（不开 PR）：必须是 App 令牌，GITHUB_TOKEN 的 push 不会触发 build.yml
          git push origin "HEAD:refs/heads/main"
          {
            printf '直推 `main`：stable \`%s\`、alpha \`%s\`。\n\n' "$stable" "$alpha"
            printf '验收看本次 push 触发的 `build.yml`：稳定版两套包把关，抢先版只记录不把关。\n'
          } >> "$GITHUB_STEP_SUMMARY"
