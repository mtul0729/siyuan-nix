name: Auto update SiYuan

# 自动把 SiYuan 追到上游最新稳定版：scripts/update.py 负责升 tag + 轮换三个 FOD 哈希，
# 本 workflow 只做编排（检测改动 → 开 PR），真正的跨平台验收交给 PR 上的 build.yml。
#
# 身份：用 GitHub App 令牌而非 GITHUB_TOKEN。原因是 GitHub 规定 GITHUB_TOKEN 产生的事件
# 不会触发其它 workflow —— 那样 PR 上的 build.yml 会停在 action_required 需人工批准。
# App 令牌则：PR 作者是 <app>[bot]，其 pull_request 事件能正常触发 build.yml。
# 需要 repo variable APP_CLIENT_ID（App 的 Client ID）+ repo secret APP_PRIVATE_KEY
# （用仓库根的 .wizard-github-app.sh 引导创建；详见 README 的“自动升级”一节）。
#
# 注意：schedule 触发要求本文件已存在于默认分支（main）。
on:
  schedule:
    # 每天 03:17 UTC 检查一次
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: '目标 tag（如 v3.9.0）；留空则自动取上游最新稳定版'
        required: false
        default: ''

# 同一时刻只跑一个，避免两次运行同时改 tag/开 PR；不取消进行中的运行（构建很贵）
concurrency:
  group: auto-update-siyuan
  cancel-in-progress: false

# GITHUB_TOKEN 只需只读：所有写操作（推分支、开 PR）都走下面的 GitHub App 令牌。
permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # 先取 App 令牌，再让 checkout 用它，这样 git push 与 gh 都是 App 身份。
      - id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v17
        with:
          name: mtul
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Bump tag and rotate FOD hashes
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_TAG" ]]; then
            python3 scripts/update.py "$INPUT_TAG"
          else
            python3 scripts/update.py
          fi

      - name: Detect changes
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "已是最新稳定版，无需升级。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve pins, branch and existing PR
        id: target
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          python3 scripts/update.py --print-pins > pins.json
          tag="$(jq -r .tag pins.json)"
          branch="auto-update/siyuan-$tag"
          {
            echo "tag=$tag"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"
          exists=false
          if [[ -n "$(gh pr list --state open --head "$branch" --json number --jq '.[].number')" ]]; then
            exists=true
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      - name: Commit, push and open PR
        if: steps.diff.outputs.changed == 'true' && steps.target.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          tag='${{ steps.target.outputs.tag }}'
          branch='${{ steps.target.outputs.branch }}'

          # commit 作者与 PR 作者一致。邮箱前缀必须是 bot 的**用户 ID**（不是 App ID），
          # 否则 GitHub 不会把 commit 归属到 <app-slug>[bot]（API 里表现为 login: none）。
          bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add flake.nix pkgs/siyuan-kernel.nix pkgs/siyuan-ui.nix
          git commit -m "siyuan: bump to $tag"
          # 这些分支归自动化所有，force 覆盖以保持幂等（open PR 已在上游闸门跳过，不会误覆盖人工改动）
          git push --force origin "$branch"

          {
            printf '自动升级到上游稳定版 `%s`。\n\n' "$tag"
            printf '由 `.github/workflows/update.yml` 调用 `scripts/update.py` 生成（升 tag + 占位 → 真实哈希轮换）。\n\n'
            printf '| FOD | 位置 | 值 |\n'
            printf '| --- | --- | --- |\n'
            printf '| `src` | `flake.nix` | `%s` |\n' "$(jq -r .src pins.json)"
            printf '| `vendorHash` | `pkgs/siyuan-kernel.nix` | `%s` |\n' "$(jq -r .vendorHash pins.json)"
            printf '| `pnpmDeps` | `pkgs/siyuan-ui.nix` | `%s` |\n\n' "$(jq -r .pnpmDeps pins.json)"
            printf '验收以本 PR 上的 `build.yml` 为准：`siyuan-server` 与 `siyuan-client` 构建成功即视为绿。\n'
            printf '`siyuan-kernel-test` 跑红是设计内常态（沙箱缺少 `../../app/*` 资源），不是本次升级的回归。\n'
          } > pr-body.md

          gh pr create --base main --head "$branch" \
            --title "siyuan: bump to $tag" \
            --body-file pr-body.md
