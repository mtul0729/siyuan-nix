name: Set up Nix build environment
description: Installs Nix and configures the mtul cachix cache; every built
  store path is pushed automatically (cachix daemon/post-build hook, including
  build-time deps) and nix reads from the cache directly — no explicit push
  step anywhere.
inputs:
  cachix-auth-token:
    description: CACHIX auth token; cache push is skipped when empty.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ github.token }}

    - uses: cachix/cachix-action@v17
      if: inputs.cachix-auth-token != ''
      with:
        name: mtul
        authToken: ${{ inputs.cachix-auth-token }}
        # daemon 模式：cachix 在 job 结束时把队列里的路径推送完（自动 flush），无需显式 push。
        # 读命中由 nix 直接向 https://mtul.cachix.org 拉取，已在流水线中验证可用
        # （每轮约 15 个自定义路径命中，含 siyuan-client/kernel/server/ui 及其 go-modules/pnpm-deps）。
        useDaemon: true
