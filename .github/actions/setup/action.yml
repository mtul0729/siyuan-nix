name: Set up Nix build environment
description: Installs Nix and configures the mtul cachix cache; every built
  store path is pushed automatically via cachix's post-build hook
  (build-time deps included) and nix reads from the cache directly — no
  explicit push step anywhere.
inputs:
  cachix-auth-token:
    description: CACHIX auth token; cache push is skipped when empty.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ github.token }}

    - uses: cachix/cachix-action@v17
      if: inputs.cachix-auth-token != ''
      with:
        name: mtul
        authToken: ${{ inputs.cachix-auth-token }}
        # 直接把 mtul.cachix.org 作为 substituter：nix 直接拉缓存，读命中可靠。
        # daemon 模式会把 substituter 设为 127.0.0.1 的本地 daemon，本 CI 里它不回源读取，
        # 导致每次 build 都从源码重编、完全没用上缓存（已确认 0 次 cache 读）。
        # 写仍由 cachix 的 post-build hook 在 job 结束时自动推送（自动 flush），无需显式 push。
        useDaemon: false
